name: 检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支来了新提交就把旧的跑停 —— 省下来的都是 CI 分钟。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查（${{ matrix.os }}）
    # 两个平台都跑一遍。
    # 以前的 build.sh 漏了架构校验、前端镜像同步，Windows 上却好好的 ——
    # 这类差异只有两个平台都跑才会暴露出来。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 缓存 Go 模块与编译缓存，依赖没变就不用重新下载。
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 前端完整性检查
        run: go run ./scripts check_frontend

  build:
    name: 打包 x86 与 arm64
    needs: check
    # 在 Linux runner 上打包：fnpack 按运行平台自动选，
    # scripts build 会把 linux-amd64 那一份下到 build/fnpack/（版本固定 1.2.3），不进版本库。
    # Linux runner 比 Windows runner 快一半左右。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 算缓存键
        id: cachekey
        shell: bash
        # 打包资源（内核/geodata/第三方面板）缓存按天分桶：
        # 一天内重复跑直接复用，隔天重新拉一次。
        # 不按天分桶的话，下载脚本「文件已存在就跳过」，latest 就再也更新不了了。
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 缓存打包资源
        uses: actions/cache@v4
        with:
          path: assets
          # 版本变量 + 下载脚本的内容 + 日期：
          # 换了版本或改了下载逻辑，键都会变，不会拿到不对的旧文件。
          key: assets-${{ vars.MIHOMO_VERSION }}-${{ vars.GEODATA_VERSION }}-${{ hashFiles('scripts/fetchmihomo.go', 'scripts/fetchgeo.go', 'scripts/fetchdashboard.go') }}-${{ steps.cachekey.outputs.date }}

      - name: 缓存 fnpack 打包器
        uses: actions/cache@v4
        with:
          path: build/fnpack
          # 版本写死在 scripts/fetchfnpack.go 里，脚本一改键就变。
          key: fnpack-${{ runner.os }}-${{ hashFiles('scripts/fetchfnpack.go') }}

      - name: 准备 mihomo 内核
        run: go run ./scripts fetch_mihomo
        env:
          # 不设就用 scripts/fetchmihomo.go 里的默认版本。
          MIHOMO_VERSION: ${{ vars.MIHOMO_VERSION }}

      - name: 准备 geodata
        run: go run ./scripts fetch_geodata
        env:
          GEODATA_VERSION: ${{ vars.GEODATA_VERSION }}

      - name: 准备第三方面板
        run: go run ./scripts fetch_dashboard

      - name: 打包
        # 打包流程在 scripts/build.go 里，唯一实现，跨平台。
        run: go run ./scripts build all

      - name: 生成并校验 FnDepot 索引
        # 源索引（fnpack.json）是客户端唯一的版本依据：
        # 这里生成一遍并按规范校验，格式错了在发版前就能发现。
        shell: bash
        run: |
          set -e
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' fnos/manifest | head -1)"
          go run ./scripts fndepot build --fresh \
            --out build/fnpack.json \
            --icon fnos/ICON.PNG \
            --release-base "https://github.com/${{ github.repository }}/releases/download/v${VERSION}" \
            --fpk "x86=build/Mihomo-${VERSION}-x86.fpk" \
            --fpk "arm=build/Mihomo-${VERSION}-arm64.fpk"
          go run ./scripts fndepot check --file build/fnpack.json
          # 三层核对里的前两层：索引 ↔ 包内 manifest ↔ 摘要与大小。
          # Release 资产那层要等发版时才有，这里查不了。
          go run ./scripts fndepot verify \
            --file build/fnpack.json \
            --icon fnos/ICON.PNG \
            --fpk "x86=build/Mihomo-${VERSION}-x86.fpk" \
            --fpk "arm=build/Mihomo-${VERSION}-arm64.fpk"

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-fpk
          path: |
            build/Mihomo-*-x86.fpk
            build/Mihomo-*-arm64.fpk
          if-no-files-found: error
